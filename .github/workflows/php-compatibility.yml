name: PHP compatibility

on:
  push:
    branches:
      - monitor-1.4.0
  pull_request:

permissions:
  contents: read

jobs:
  php-lint:
    name: PHP ${{ matrix.php }} syntax
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php:
          - '5.6'
          - '8.1'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint PHP and INC files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find . -type f \( -name '*.php' -o -name '*.inc' \) -print0)

  security-regressions:
    name: Security and API regression guard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Reject known unsafe or incompatible patterns
        shell: bash
        run: |
          set -euo pipefail

          if grep -R -n -E \
            --exclude-dir='.git' --exclude-dir='dist' --exclude-dir='package' \
            --include='*.php' --include='*.inc' \
            'CURLOPT_SSL_VERIFYPEER[[:space:]]*(=>|,)[[:space:]]*false|sleep[[:space:]]*\([[:space:]]*60[[:space:]]*\)|ben@geeklog\.fr|COM_siteHeader[[:space:]]*\(|COM_siteFooter[[:space:]]*\(' \
            .; then
            echo 'Known unsafe, deprecated, or Geeklog 2.2.x-incompatible Monitor pattern detected.'
            exit 1
          fi

          echo 'No guarded regression pattern found.'

      - name: Check Geeklog 2.2.x configuration metadata
        shell: bash
        run: |
          set -euo pipefail
          grep -q "GLOBALS\['LANG_configsections'\]\['monitor'\]" language/english.php
          grep -q "GLOBALS\['LANG_configsubgroups'\]\['monitor'\]" language/english.php
          grep -q "GLOBALS\['LANG_confignames'\]\['monitor'\]" language/english.php
          grep -q "GLOBALS\['LANG_tab'\]\['monitor'\]" language/english.php
          grep -q "'tab_main' => 'Main'" language/english.php
          grep -q "GLOBALS\['LANG_fs'\]\['monitor'\]" language/english.php
          grep -q "add('tab_main', null, 'tab'" install_defaults.php
          grep -q "add('emails', \$_monitor_DEFAULT\['emails'\], 'text', 0, 0, null" install_defaults.php
          grep -q "add('repository', \$_monitor_DEFAULT\['repository'\], 'text', 0, 0, null" install_defaults.php
          grep -q "selectionArray = -1" lib/MonitorConfigCompat.php
          test -f language/english_utf-8.php

      - name: Check Changes monitoring guardrails
        shell: bash
        run: |
          set -euo pipefail
          test -f lib/MonitorChanges.php
          test -f admin/changes.php
          grep -q "SEC_hasRights('monitor.admin')" admin/changes.php
          grep -q "SEC_checkToken()" admin/changes.php
          grep -q "SEC_createToken()" admin/changes.php
          grep -q "monitor-changes-" lib/MonitorChanges.php
          grep -q "array_slice(\$snapshots, -10)" lib/MonitorChanges.php
          grep -q "524288" lib/MonitorChanges.php
          if grep -q "path_public_html" lib/MonitorChanges.php; then
            echo 'Changes snapshots must stay outside public_html.'
            exit 1
          fi
          echo 'Changes monitoring guardrails present.'

      - name: Check daily log rotation guardrails
        shell: bash
        run: |
          set -euo pipefail
          test -f lib/MonitorLogRotation.php
          test -f admin/log-archives.php
          grep -q "MONITOR_LOG_rotateDaily" functions.inc
          grep -q "MONITOR_LOG_archiveOne" lib/MonitorLogRotation.php
          grep -q "@copy(\$path, \$archive)" lib/MonitorLogRotation.php
          grep -q "@ftruncate(\$handle, 0)" lib/MonitorLogRotation.php
          grep -q "MONITOR_LOG_cleanupArchives" lib/MonitorLogRotation.php
          grep -q "SEC_hasRights('monitor.admin')" admin/log-archives.php
          if grep -q "path_public_html" lib/MonitorLogRotation.php; then
            echo 'Log archives must stay outside public_html.'
            exit 1
          fi
          echo 'Daily log rotation guardrails present.'

      - name: Check read-only service contract
        shell: bash
        run: |
          set -euo pipefail
          test -f services.inc.php
          test -f lib/MonitorServices.php
          test -f docs/SERVICES.md
          grep -q "plugin_wsEnabled_monitor" functions.inc
          grep -q "services.inc.php" functions.inc
          grep -q "service_get_status_monitor" services.inc.php
          grep -q "service_get_changes_monitor" services.inc.php
          grep -q "service_get_plugins_monitor" services.inc.php
          grep -q "service_get_log_summary_monitor" services.inc.php
          grep -q "service_get_log_archives_monitor" services.inc.php
          grep -q "service_get_configuration_audit_monitor" services.inc.php
          grep -q "SEC_hasRights('monitor.admin')" services.inc.php
          grep -q "SEC_inGroup('Root')" services.inc.php
          grep -q "schema_version" lib/MonitorServices.php
          grep -q "include_remote" lib/MonitorServices.php
          if grep -E -q "site_value|db_value|effective_value|['\"]sql['\"]|siteconfig_path" services.inc.php; then
            echo 'Service callbacks must not expose configuration values, SQL or siteconfig paths.'
            exit 1
          fi
          if grep -E -q "unlink\(|ftruncate\(|file_put_contents\(|DB_(insert|delete)|UPDATE |DELETE FROM|INSERT INTO" lib/MonitorServices.php services.inc.php; then
            echo 'Monitor service layer must remain read-only.'
            exit 1
          fi
          echo 'Read-only Monitor service contract guardrails present.'

      - name: Check lifecycle observation guardrails
        shell: bash
        run: |
          set -euo pipefail
          test -f lib/MonitorContentActivity.php
          grep -q "plugin_itemsaved_monitor" functions.inc
          grep -q "plugin_itemdeleted_monitor" functions.inc
          grep -q "MONITOR_ACTIVITY_record" functions.inc
          grep -q "monitor-content-activity-" lib/MonitorContentActivity.php
          grep -q "30 \* 86400" lib/MonitorContentActivity.php
          grep -q "array_slice(\$kept, -500)" lib/MonitorContentActivity.php
          grep -q "LOCK_EX" lib/MonitorContentActivity.php
          grep -q "content_activity" lib/MonitorServices.php
          python3 - <<'PY'
          import pathlib
          import re
          import sys

          source = pathlib.Path('lib/MonitorContentActivity.php').read_text(encoding='utf-8')
          if re.search(r'''['"](?:content|title|description|body|text)['"]\s*=>''', source):
              print('Lifecycle journal must contain identity metadata only, not copied content.')
              sys.exit(1)
          PY
          echo 'Lifecycle observation guardrails present.'

      - name: Check oversized media locator guardrails
        shell: bash
        run: |
          set -euo pipefail
          test -f lib/MonitorMediaDiagnostics.php
          test -f admin/media-diagnostics.php
          grep -q "MONITOR_MEDIA_oversizedImages" lib/MonitorHealth.php
          grep -q "relative_path" lib/MonitorMediaDiagnostics.php
          grep -q "public_url" lib/MonitorMediaDiagnostics.php
          grep -q "SEC_hasRights('monitor.admin')" admin/media-diagnostics.php
          grep -q "filemanager/index.php" admin/media-diagnostics.php
          grep -q "Show files" templates/administration.thtml
          grep -q "Open File Manager" templates/administration.thtml
          grep -q "maxItems" lib/MonitorMediaDiagnostics.php
          if grep -E -q "unlink\(|rename\(|copy\(|file_put_contents\(|ftruncate\(" lib/MonitorMediaDiagnostics.php admin/media-diagnostics.php; then
            echo 'Media locator must remain read-only.'
            exit 1
          fi
          echo 'Oversized media locator guardrails present.'
